version: "3.9"

services:
  app:
    build: ./main-project
    ports:
      - '8083:8080'
    environment:
      DB_HOST: ${DB_HOST:-postgresql:5432}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-admin}
      DB_NAME: ${DB_NAME:-postgres}
    depends_on:
      - postgresql
    networks:
      - backend

  postgresql:
    image: 'postgres:latest'
    environment:
      - 'POSTGRES_DB=postgres'
      - 'POSTGRES_PASSWORD=admin'
      - 'POSTGRES_USER=postgres'
    ports:
      - '5432:5432'
    networks:
      - backend

networks:
  backend: