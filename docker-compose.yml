version: "3.9"

services:
  app:
    build: ./main-project
    container_name: main-service
    ports:
      - '8083:8080'
    environment:
      DB_HOST: ${DB_HOST:-postgresql:5432}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-admin}
      DB_NAME: ${DB_NAME:-postgres}
      DB_HOST_TEST: ${DB_HOST_TEST:-postgresql:5435}
      DB_USER_TEST: ${DB_USER_TEST:-postgres}
      DB_PASSWORD_TEST: ${DB_PASSWORD_TEST:-admin}
      DB_NAME_TEST: ${DB_NAME_TEST:-postgres}
      KAFKA_SERVER: ${KAFKA_SERVER:-broker-1:29092,broker-2:29093}
    depends_on:
      - postgresql
    networks:
      - backend

  service-2:
    build: ./second-service
    container_name: service-2
    ports:
      - '8084:8080'
    environment:
      DB_HOST: ${DB_HOST:-postgresql-2:5432}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-admin}
      DB_NAME: ${DB_NAME:-postgres}
      KAFKA_SERVER: ${KAFKA_SERVER:-broker-1:29092,broker-2:29093}
    depends_on:
      - postgresql-2
    networks:
      - backend

  service-3:
    build: ./third_service
    container_name: service-3
    ports:
      - '8085:8080'
    environment:
      DB_HOST: ${DB_HOST:-postgresql-3:5432}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-admin}
      DB_NAME: ${DB_NAME:-postgres}
      KAFKA_SERVER: ${KAFKA_SERVER:-broker-1:29092,broker-2:29093}
    depends_on:
      - postgresql-3
    networks:
      - backend

  postgresql:
    image: 'postgres:latest'
    container_name: postgresql-1
    environment:
      - 'POSTGRES_DB=postgres'
      - 'POSTGRES_PASSWORD=admin'
      - 'POSTGRES_USER=postgres'
    ports:
      - '5432:5432'
    networks:
      - backend
    volumes:
      - pg-data:/var/lib/postgresql/data

  postgresql-2:
    image: 'postgres:latest'
    container_name: postgresql-2
    environment:
      - 'POSTGRES_DB=postgres'
      - 'POSTGRES_PASSWORD=admin'
      - 'POSTGRES_USER=postgres'
    ports:
      - '5433:5432'
    networks:
      - backend
    volumes:
      - pg-data-2:/var/lib/postgresql/data

  postgresql-3:
    image: 'postgres:latest'
    container_name: postgresql-3
    environment:
      - 'POSTGRES_DB=postgres'
      - 'POSTGRES_PASSWORD=admin'
      - 'POSTGRES_USER=postgres'
    ports:
      - '5434:5432'
    networks:
      - backend
    volumes:
      - pg-data-3:/var/lib/postgresql/data

  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    hostname: zookeeper
    container_name: zookeeper
    ports:
      - '2182:2182'
    environment:
      ZOOKEEPER_CLIENT_PORT: 2182
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - backend

  broker-1:
    image: confluentinc/cp-kafka:latest
    hostname: broker-1
    container_name: broker-1
    depends_on:
      - zookeeper
    ports:
      - '29092:29092'
      - '9092:9092'
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2182
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker-1:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    networks:
      - backend

  broker-2:
    image: confluentinc/cp-kafka:latest
    hostname: broker-2
    container_name: broker-2
    depends_on:
      - zookeeper
    ports:
      - '29093:29093'
      - '9093:9093'
    environment:
      KAFKA_BROKER_ID: 2
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2182
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker-2:29093,PLAINTEXT_HOST://localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    networks:
      - backend

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus:/etc/prometheus/
    container_name: prometheus
    hostname: prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    ports:
      - '9090:9090'
    restart: unless-stopped
    environment:
      TZ: "Europe/Moscow"
    networks:
      - backend

  grafana:
    image: grafana/grafana-enterprise
    container_name: grafana
    restart: unless-stopped
    volumes:
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/provisioning/dashboards/dashboard.yml:/etc/grafana/provisioning/dashboards/dashboard.yml
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
    ports:
      - '3000:3000'
    networks:
      - backend

  wiremock-demo:
    image: bscmsc/bsc-wire-mock:latest
    ports:
      - '1398:1398'
    volumes:
      - ./wiremock/mappings:/app/mappings

networks:
  backend:

volumes:
  pg-data:
  pg-data-2:
  pg-data-3:
  pg-data-test: