account:
  remove-arrest:
    delay-in-seconds: 10
    quantity-per-time: 5

cache:
  defaultExpirationInSeconds: 60

client:
  unblock:
    delay-in-seconds: 10
    quantity-per-time: 5

logging:
  level:
    org.springframework: INFO

management:
  endpoints:
    web.exposure.include: health,prometheus,metrics,info,kafka,shutdown,restart,logfile
  endpoint:
    health:
      show-details: always


